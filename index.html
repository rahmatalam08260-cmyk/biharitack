<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneGyan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky masthead, left column of post cards (lead story + list), right rail with search, categories, recent posts. Article view replaces the list via hash routing. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --fg:#10181f; --muted:#56646f; --line:#dbe3e8;
  --accent:#0b7d80; --accent-fg:#ffffff; --spark:#f2a900; --chip:#e4edf0;
  --font-display:"Bricolage Grotesque","Hind",system-ui,sans-serif;
  --font-body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1318; --surface:#141d24; --fg:#e8eff3; --muted:#92a3ae; --line:#24323b;
  --accent:#3cc4c7; --accent-fg:#06191a; --spark:#ffc533; --chip:#1b2831; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1318; --surface:#141d24; --fg:#e8eff3; --muted:#92a3ae; --line:#24323b;
  --accent:#3cc4c7; --accent-fg:#06191a; --spark:#ffc533; --chip:#1b2831; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.6;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:24px;border:3px solid var(--accent);border-radius:4px;position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;background:var(--spark);border-radius:50%}
.logo span{color:var(--accent)}
nav{display:flex;gap:4px 16px;flex-wrap:wrap;margin-left:auto;font-size:.95rem;font-weight:500}
nav a{text-decoration:none;color:var(--muted);padding:4px 2px}
nav a:hover{color:var(--accent)}
#theme{background:var(--chip);border:0;color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.tag{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:28px 48px}
main,aside{min-width:0}
.intro{margin-bottom:20px}
.intro h1{font-family:var(--font-display);font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.intro p{color:var(--muted);margin:0;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.card{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.card.lead{grid-template-columns:1fr}
.card.lead .cover{aspect-ratio:16/7}
.cover{border-radius:6px;aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;color:#fff;background:var(--c1)}
.cover::before{content:"";position:absolute;right:-18%;top:-30%;width:70%;aspect-ratio:1;border-radius:50%;background:var(--c2);opacity:.9}
.cover b{position:relative;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:4px}
.card h2{font-family:var(--font-display);font-size:1.3rem;line-height:1.2;margin:4px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.card.lead h2{font-size:1.8rem}
.card h2 a{text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.card p{margin:0 0 8px;color:var(--muted);font-size:.98rem}
.more{color:var(--accent);font-weight:600;text-decoration:none;font-size:.95rem}
.more:hover{text-decoration:underline}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
aside .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
aside h3{font-family:var(--font-display);font-size:1.05rem;margin:0 0 10px}
#q{width:100%;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
aside ul{list-style:none;margin:0;padding:0}
aside li{padding:7px 0;border-top:1px solid var(--line);font-size:.95rem;line-height:1.35}
aside li:first-child{border-top:0}
aside li a{text-decoration:none}
aside li a:hover{color:var(--accent)}
aside li button{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%}
aside li button:hover{color:var(--accent)}
.count{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.article{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,32px)}
.article .cover{aspect-ratio:16/6;margin-bottom:18px}
.article h1{font-family:var(--font-display);font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.12;letter-spacing:-.02em;margin:6px 0 12px;text-wrap:balance}
.article .body{max-width:65ch}
.article ol{padding-left:1.3em}
.article li{margin-bottom:10px}
.note{border-left:4px solid var(--spark);background:var(--chip);padding:10px 14px;border-radius:0 8px 8px 0;margin:20px 0;font-size:.95rem}
.back{display:inline-block;margin-bottom:14px;color:var(--accent);font-weight:600;text-decoration:none}
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:20px;color:var(--muted);font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
footer a{margin-right:14px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,4vw,32px)}
.page h1{font-family:var(--font-display);margin-top:0}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .card{grid-template-columns:1fr}
  .cover{aspect-ratio:16/8}
  nav{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style>

<header class="top">
  <div class="wrap bar">
    <a class="logo" href="#home"><i></i>Phone<span>Gyan</span></a>
    <nav aria-label="Menu">
      <a href="#about-us">About Us</a>
      <a href="#contact-us">Contact Us</a>
      <a href="#disclaimer">Disclaimer</a>
      <a href="#privacy-policy">Privacy Policy</a>
      <a href="#terms">Terms</a>
    </nav>
    <button id="theme" type="button" aria-label="Theme badlo">Theme</button>
  </div>
</header>

<div class="wrap layout">
  <main id="main"></main>
  <aside>
    <div class="box">
      <h3>Search</h3>
      <input id="q" type="search" placeholder="Jaise: whatsapp, wallpaper" aria-label="Search posts">
    </div>
    <div class="box">
      <h3>Recent Posts</h3>
      <ul id="recent"></ul>
    </div>
    <div class="box">
      <h3>Categories</h3>
      <ul id="cats"></ul>
    </div>
  </aside>
</div>

<footer>
  <div class="wrap">
    <span>© 2026 PhoneGyan. Hindi-English mein mobile tips.</span>
    <span><a href="#about-us">About</a><a href="#privacy-policy">Privacy</a><a href="#contact-us">Contact</a></span>
  </div>
</footer>

<script>
var POSTS=[
{id:"windows-7-launcher",t:"Apne phone mein Windows 7 jaisa look kaise laye",d:"2 Nov 2026",cat:"Android Apps",c:["#0b5f8a","#2fb1d9"],
 x:"Kya aap apne Android phone ko computer jaisa dikhana chahte hain? Launcher app se Start Menu, Taskbar aur Desktop jaisa layout mil jata hai.",
 s:["Play Store se ek trusted desktop-style launcher download karein.","Install ke baad Home button dabayein aur launcher ko default chunein.","Settings mein icon size, taskbar position aur wallpaper apni pasand se set karein.","Purana launcher wapas chahiye to Settings > Apps > Default apps mein badal lein."]},
{id:"lock-screen-wallpaper",t:"Lock screen par pasand ka wallpaper kaise lagaye",d:"19 Oct 2026",cat:"Android Tips",c:["#6b2f8f","#e0508a"],
 x:"Phone ki lock screen ko stylish banane ke liye apni photo ya HD wallpaper lagana bahut aasan hai. Bina kisi app ke bhi ho sakta hai.",
 s:["Home screen par khali jagah par long press karein.","Wallpaper ya Lock screen option chunein.","Gallery se photo select karein ya built-in collection dekhein.","Photo ko zoom karke crop karein aur Set as lock screen dabayein."]},
{id:"charging-photo",t:"Mobile charge karte samay apna photo kaise dikhaye",d:"19 Oct 2026",cat:"Android Apps",c:["#b3541e","#f2a900"],
 x:"Charging animation apps ki madad se aap charge lagate hi screen par apni photo ya animation dikha sakte hain.",
 s:["Play Store par charging animation app search karke reviews check karein.","App kholkar gallery se apni photo chunein.","Animation style aur display time set karein.","Zaroori permissions sirf tabhi dein jab app unka reason bataye."]},
{id:"bina-sim-call",t:"Bina SIM ke Wi-Fi se free call kaise kare",d:"19 Oct 2026",cat:"Android Tips",c:["#15703d","#6fd08c"],
 x:"Wi-Fi ya internet ho to WhatsApp, Telegram ya Google Meet se voice aur video call SIM ke bina ho jati hai.",
 s:["Wi-Fi se connect karein.","Koi calling app install karein aur apne number ya email se login karein.","Contact chunkar voice ya video call dabayein.","Call quality ke liye strong network ke paas rahein."]},
{id:"whatsapp-last-seen",t:"WhatsApp par last seen kaise hide kare",d:"14 Oct 2026",cat:"WhatsApp Tricks",c:["#0f7a5c","#25d366"],
 x:"Agar aap nahi chahte ki dusre dekhein aap kab online the, to privacy setting se last seen band kar sakte hain.",
 s:["WhatsApp kholein aur menu se Settings mein jayein.","Privacy par tap karein.","Last seen & online chunein.","Nobody ya My contacts select karein."]},
{id:"whatsapp-second-phone",t:"Apna WhatsApp doosre phone mein kaise chalaye",d:"14 Oct 2026",cat:"WhatsApp Tricks",c:["#1a4d8f","#25d366"],
 x:"Linked devices feature se ek hi account ko apne dusre phone par use kiya ja sakta hai, number badle bina.",
 s:["Dusre phone par WhatsApp install karein aur Link to existing account chunein.","Pehle phone mein Settings > Linked devices kholein.","Link a device dabakar QR code scan karein.","Chats sync hone ka intezaar karein."]},
{id:"mobile-sound-badhaye",t:"Mobile ki awaaz kaise badhaye",d:"9 Oct 2026",cat:"Android Tips",c:["#8a1f3d","#ff7a59"],
 x:"Full volume par bhi awaaz kam lage to speaker saaf karna, equalizer aur sound settings kaafi madad karte hain.",
 s:["Speaker grill ko soft brush se saaf karein.","Settings > Sound mein media volume aur equalizer check karein.","Phone ka case hata kar dekhein, kabhi speaker dab jata hai.","Dolby ya Sound enhancer on karein agar available ho."]},
{id:"apni-call-history",t:"Apne phone ki purani call history kaise dekhe",d:"9 Oct 2026",cat:"Data Recovery",c:["#34495e","#7fb3d5"],
 x:"Apne phone ki call log delete ho gayi ho to backup aur operator ke zariye details wapas mil sakti hain.",
 s:["Phone app mein menu se Call history kholein.","Google Backup ya company ka cloud (jaise Samsung Cloud) check karein.","Backup se restore karne ke liye Settings > Google > Backup use karein.","Bill details ke liye apne operator ke app mein login karein."]}
];
var CATS=["Android Apps","Android Tips","Data Recovery","WhatsApp Tricks"];
var PAGES={
"about-us":["About Us","PhoneGyan ek chhota Hindi-English blog hai jahan mobile, apps aur WhatsApp ke aasan tips milte hain. Hum har step saaf bhasha mein likhte hain taaki koi bhi follow kar sake."],
"contact-us":["Contact Us","Sawal ya suggestion ke liye hume likhiye: hello@phonegyan.example (yeh ek example address hai, apna asli email yahan lagayein)."],
"disclaimer":["Disclaimer","Is site par di gayi jankari sirf education ke liye hai. Kisi app ya setting ko use karne se pehle apne phone ka backup le lein. Hum kisi doosre ki jasoosi ya tracking ko support nahi karte."],
"privacy-policy":["Privacy Policy","Yeh site aapse koi personal data collect nahi karti. Search aur filter aapke browser mein hi chalte hain."],
"terms":["Terms and Conditions","Is site ka content padhne ke liye free hai. Bina anumati poora content copy karke dobara publish na karein."]
};
var main=document.getElementById("main"),state={cat:"All",q:""};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cover(p){return '<div class="cover" style="--c1:'+p.c[0]+';--c2:'+p.c[1]+'"><b>'+esc(p.cat)+'</b></div>'}
function card(p,lead){return '<article class="card'+(lead?' lead':'')+'">'+cover(p)+'<div><div class="tag">'+esc(p.d)+' · Admin</div><h2><a href="#'+p.id+'">'+esc(p.t)+'</a></h2><p>'+esc(p.x)+'</p><a class="more" href="#'+p.id+'">Poora padhein →</a></div></article>'}
function list(){
  var q=state.q.toLowerCase();
  var r=POSTS.filter(function(p){return (state.cat==="All"||p.cat===state.cat)&&(!q||(p.t+p.x+p.cat).toLowerCase().indexOf(q)>-1)});
  var chips=["All"].concat(CATS).map(function(c){return '<button class="chip" type="button" data-cat="'+esc(c)+'" aria-pressed="'+(state.cat===c)+'">'+esc(c)+'</button>'}).join("");
  var body=r.length?r.map(function(p,i){return card(p,i===0&&state.cat==="All"&&!q)}).join(""):'<div class="empty">Is search se koi post nahi mili. Dusra shabd try karein.</div>';
  main.innerHTML='<div class="intro"><h1>Mobile ke aasan tips, Hindi-English mein</h1><p>Android, WhatsApp aur apps ke step-by-step guides. Har post mein seedhe steps, koi ghumav nahi.</p></div><div class="chips" role="group" aria-label="Category filter">'+chips+'</div>'+body;
}
function article(p){
  main.innerHTML='<a class="back" href="#home">← Sab posts</a><article class="article">'+cover(p)+'<div class="tag">'+esc(p.d)+' · Admin · '+esc(p.cat)+'</div><h1>'+esc(p.t)+'</h1><div class="body"><p>'+esc(p.x)+'</p><h2 style="font-family:var(--font-display);font-size:1.2rem">Steps</h2><ol>'+p.s.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ol><div class="note">Tip: Koi bhi badlav karne se pehle phone ka backup zaroor le lein. Menu ke naam alag phone mein thode alag ho sakte hain.</div></div></article>';
  document.title=p.t+" | PhoneGyan";
}
function route(){
  var h=location.hash.replace("#","");
  document.title="PhoneGyan";
  var p=POSTS.filter(function(x){return x.id===h})[0];
  if(p){article(p)}
  else if(PAGES[h]){main.innerHTML='<a class="back" href="#home">← Home</a><div class="page"><h1>'+esc(PAGES[h][0])+'</h1><p>'+esc(PAGES[h][1])+'</p></div>'}
  else{list()}
  window.scrollTo(0,0);
}
function side(){
  document.getElementById("recent").innerHTML=POSTS.slice(0,5).map(function(p){return '<li><a href="#'+p.id+'">'+esc(p.t)+'</a></li>'}).join("");
  document.getElementById("cats").innerHTML=CATS.map(function(c){var n=POSTS.filter(function(p){return p.cat===c}).length;return '<li><button type="button" data-cat="'+esc(c)+'"><span>'+esc(c)+'</span><span class="count">'+n+'</span></button></li>'}).join("");
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-cat]");
  if(!b)return;
  state.cat=b.getAttribute("data-cat");
  if(location.hash&&location.hash!=="#home"){location.hash="home"}else{list()}
});
document.getElementById("q").addEventListener("input",function(e){
  state.q=e.target.value;
  if(location.hash&&location.hash!=="#home"){location.hash="home"}else{list()}
});
document.getElementById("theme").addEventListener("click",function(){
  var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
  r.setAttribute("data-theme",dark?"light":"dark");
});
window.addEventListener("hashchange",route);
side();route();
</script>

</html>
